<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Website demo</title>
<style>
:root{--bg:#fff;--ink:#14171a;--mute:#5d6670;--line:#e6e8eb;--soft:#f4f5f7;--acc:#0b6bcb;--accink:#fff;--dark:#101418;--darkink:#fff;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--head:var(--sans);--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:86px}
img{display:block;max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.demo{background:#111;color:#cfd3d8;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 14px}
.demo b{color:#fff;font-weight:600}
.demo button{background:none;border:0;color:#9aa1a9;font-size:16px;line-height:1;padding:2px 4px;cursor:pointer}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.logo{font-family:var(--head);font-weight:700;font-size:18px;line-height:1.15;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere;padding:8px 0}
.nav a.cta{flex:0 0 auto;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px}
.hero{position:relative;color:#fff;background:#222}
.hero img{width:100%;height:440px;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.82) 100%)}
.hero .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 20px 24px;max-width:720px;margin:0 auto}
.tagl{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;margin-bottom:12px}
h1{font-family:var(--head);font-size:38px;line-height:1.04;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0 0 16px;font-size:16px;color:rgba(255,255,255,.9);max-width:36ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;text-decoration:none;border:0;cursor:pointer}
.b.p{background:var(--acc);color:var(--accink)}
.b.w{background:#fff;color:#111}
.b.g{background:#1faf54;color:#fff}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:var(--bg);padding:14px 20px}
.facts b{display:block;font-family:var(--head);font-size:17px}
.facts span{font-size:13px;color:var(--mute)}
section{padding:36px 0 4px}
h2{font-family:var(--head);font-size:26px;line-height:1.12;letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px}
.svc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.svc div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.svc div:first-child{border-top:0}
.svc span{font-weight:500}
.svc b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--acc);font-weight:700}
.note{font-size:12px;color:var(--mute);margin:8px 2px 0}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.card img{width:100%;height:190px;object-fit:cover}
.card .cb{padding:14px 16px 16px}
.card h3{font-family:var(--head);font-size:18px;margin:0 0 2px}
.card .meta{font-size:13px;color:var(--mute);margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.card .price small{font-size:12px;font-weight:500;color:var(--mute)}
.card .b{min-height:42px;padding:0 14px;font-size:14px}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px}
.card .ph{position:relative}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots a{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 0;font-weight:600;font-variant-numeric:tabular-nums}
.slots a.off{color:#b3b9c0;text-decoration:line-through;pointer-events:none;background:var(--soft)}
.tt{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tt div{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.tt div:first-child{border-top:0}
.tt time{font-weight:700;font-variant-numeric:tabular-nums}
.tt span small{display:block;color:var(--mute);font-size:13px}
.tt a{font-size:13px;font-weight:600;text-decoration:none;background:var(--soft);padding:8px 12px;border-radius:999px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{border:1px dashed #c9ced4;border-radius:var(--r);padding:16px;text-align:center}
.person i{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--soft);margin:0 auto 8px;font-style:normal;font-size:22px;color:var(--mute)}
.person b{display:block;font-size:15px}.person span{font-size:13px;color:var(--mute)}
.steps{counter-reset:s;display:grid;gap:10px}
.steps div{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--soft);border-radius:var(--r);padding:14px}
.steps div::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--accink);font-weight:700}
.steps b{display:block}.steps span{color:var(--mute);font-size:14px}
.why{background:var(--dark);color:var(--darkink);margin-top:36px;padding:32px 0}
.why h2{margin-bottom:16px}
.why .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.why .g div{background:rgba(255,255,255,.07);border-radius:14px;padding:14px}
.why b{display:block;font-size:15px;margin-bottom:2px}
.why span{font-size:13px;opacity:.75}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal img{width:100%;height:150px;object-fit:cover;border-radius:12px}
.gal img:first-child{grid-column:1/-1;height:210px}
.gal img:nth-child(2):last-child{grid-column:1/-1;height:170px}
.rev{border:1px dashed #c9ced4;border-radius:var(--r);padding:20px;text-align:center;background:var(--soft)}
.stars{font-size:22px;letter-spacing:4px;color:#c9ced4}
.rev b{display:block;margin:6px 0 2px}
.rev span{font-size:14px;color:var(--mute)}
.form{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.form label{font-size:13px;font-weight:600}
.form input,.form textarea{width:100%;margin-top:4px;border:1px solid #d4d8dd;border-radius:10px;padding:12px;font:inherit;font-size:16px;background:#fff;color:#111}
.form textarea{min-height:84px;resize:vertical}
.visit{display:grid;gap:12px}
.hours{border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.hours div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hours div:first-child{border-top:0}
.hours b{font-weight:600}
.map{position:relative;height:190px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
background:
linear-gradient(90deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%) 0 0/120px 100%,
linear-gradient(0deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%) 0 0/100% 90px,
linear-gradient(35deg,transparent 49%,#fbe9b7 49%,#fbe9b7 52%,transparent 52%),#e9eef0}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);width:34px;height:34px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--acc);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.map .pin::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
.map .lab{position:absolute;left:12px;bottom:12px;right:12px;background:#fff;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:14px}
.map .lab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#111}
.map .lab a{flex:0 0 auto;font-weight:700;color:var(--acc);text-decoration:none}
footer{margin-top:40px;border-top:1px solid var(--line);padding:22px 0 10px;font-size:13px;color:var(--mute)}
footer b{display:block;color:var(--ink);font-family:var(--head);font-size:16px;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bar .b{min-height:52px;font-size:16px}
.bar .call{background:var(--soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
svg{width:20px;height:20px;flex:0 0 auto}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}.hero img{height:520px}h1{font-size:50px}.facts{grid-template-columns:repeat(4,1fr)}.why .g{grid-template-columns:repeat(4,1fr)}.visit{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

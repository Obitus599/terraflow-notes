<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Demo</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--ac:#1b4dff;--on:#fff;--ink:#0d0e10;--mut:#5c6068;--line:#e4e5e8;--soft:#f3f4f6;--bg:#fff;--f:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:76px}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.d{font-stretch:118%;font-weight:800;letter-spacing:-.02em;line-height:.98;text-transform:uppercase}
.demo{background:#0d0e10;color:#c9ccd2;font-size:12px;padding:8px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.demo b{color:#fff}.demo button{background:none;border:0;color:#fff;font-size:18px;line-height:1;padding:4px 6px;cursor:pointer}
header{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;min-width:0}.logo img{max-height:44px;max-width:190px;width:auto;border-radius:4px}.logo.dark img{background:#111;padding:6px 10px;border-radius:8px}
.logo span{font-stretch:118%;font-weight:800;font-size:17px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
nav{display:none;gap:26px;font-size:14px;font-weight:600}
.hbtn{flex:0 0 auto;background:var(--ac);color:var(--on);font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px}
.hero{position:relative;min-height:min(86vh,720px);display:flex;align-items:flex-end;background:var(--ac);color:#fff;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.1) 35%,rgba(0,0,0,.82) 100%)}
.hero.flat::after{background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-top:120px;padding-bottom:34px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.eyebrow i{width:26px;height:3px;background:var(--ac);display:block}.hero.flat .eyebrow i{background:#fff}
h1{margin:0 0 14px;font-size:clamp(38px,9.6vw,92px);max-width:13ch;overflow-wrap:anywhere}
.hero p{margin:0 0 22px;max-width:46ch;font-size:17px;color:rgba(255,255,255,.86)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px}
.btn.wa{background:#25d366;color:#04220f}.btn.w{background:#fff;color:#0d0e10}.btn.ac{background:var(--ac);color:var(--on)}.btn.o{border:1.5px solid var(--ink)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.quick a{padding:16px 8px;text-align:center;border-left:1px solid var(--line);font-weight:700;font-size:14px}.quick a:first-child{border-left:0}.quick small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section{padding:54px 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h2{margin:0;font-size:clamp(28px,6.4vw,54px)}
.sh a{font-weight:700;font-size:14px;border-bottom:2px solid var(--ac);white-space:nowrap;padding-bottom:2px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;background:var(--soft);overflow:hidden}.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.card .tx{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.card .sub{font-size:13px;color:var(--mut)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.price{font-stretch:112%;font-weight:800;font-size:20px;letter-spacing:-.01em}
.ask{background:#25d366;color:#04220f;font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;white-space:nowrap}
.svc{border-top:2px solid var(--ink)}
.svc a{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 2px;border-bottom:1px solid var(--line);font-size:clamp(20px,4.6vw,30px);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.svc a span:last-child{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;transition:.25s}.svc a:hover span:last-child{background:var(--ac);color:var(--on)}
.band{background:var(--ink);color:#fff;padding:54px 0}.band h2{margin-bottom:22px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 6px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rail img{flex:0 0 78%;max-width:520px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;scroll-snap-align:center}
.about{display:grid;gap:26px}.about p{margin:0 0 14px;font-size:18px;line-height:1.55;color:#2b2e33}.about img{border-radius:18px;width:100%;aspect-ratio:4/3;object-fit:cover}
.visit{background:var(--ac);color:var(--on)}.visit h2{margin-bottom:18px}.visit .rows{display:grid;gap:10px;margin-bottom:22px;font-size:18px;font-weight:600}.visit .rows a{border-bottom:1px solid currentColor;align-self:start;justify-self:start}
.visit .btn.w{background:var(--on);color:var(--ac)}.visit .btn.o{border-color:var(--on)}
footer{background:var(--ink);color:#8d9199;padding:44px 0 26px;overflow:hidden}
.mark{font-size:clamp(54px,17vw,220px);color:#fff;white-space:nowrap;line-height:.84;margin:0 0 26px -4px;opacity:.96}
footer small{display:block;font-size:12px;line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .btn{min-height:50px}.bar .call{background:var(--soft)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(min-width:760px){body{padding-bottom:0}.bar{display:none}nav{display:flex}.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 36px}.about{grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}.rail{padding:0 36px}.rail img{flex-basis:44%}section,.band{padding:84px 0}.hero .wrap{padding-bottom:60px}.demo{padding:8px 36px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style></head><body>
<div class="demo" id="demo"><span>Demo for <b id="dn"></b>, built by Terraflow from this business's own photos and text</span><button aria-label="Hide" id="dx">×</button></div>
<header><div class="wrap"><a class="logo" id="logo" href="#top"></a><nav id="nav"></nav><a class="hbtn" id="hwa" href="#">WhatsApp</a></div></header>
<div class="hero" id="top"><div class="wrap"><div class="eyebrow"><i></i><span id="eb"></span></div><h1 class="d" id="h1"></h1><p id="lede"></p><div class="cta"><a class="btn wa" id="cwa" href="#">WhatsApp us</a><a class="btn w" id="c2" href="#items"></a></div></div></div>
<div class="quick"><a id="qcall" href="#">Call<small id="qcalls"></small></a><a id="qwa" href="#">WhatsApp<small>Replies in minutes</small></a><a id="qmap" href="#" target="_blank" rel="noopener">Directions<small>Open in Maps</small></a></div>
<section id="items" hidden><div class="wrap"><div class="sh rv"><h2 class="d" id="ih"></h2><a id="iall" href="#">Ask for the full list</a></div><div class="grid" id="grid"></div></div></section>
<section id="svc" hidden><div class="wrap"><div class="sh rv"><h2 class="d">What we do</h2></div><div class="svc" id="svcl"></div></div></section>
<div class="band" id="gal" hidden><div class="wrap"><h2 class="d rv" id="gh">Inside</h2></div><div class="rail" id="rail"></div></div>
<section id="about" hidden><div class="wrap about"><div class="rv"><h2 class="d" style="margin-bottom:18px">About us</h2><div id="ab"></div><a class="btn o" id="abwa" href="#">Talk to us</a></div><img id="abimg" class="rv" alt="" hidden></div></section>
<section class="visit" id="visit"><div class="wrap"><h2 class="d rv">Visit or call</h2><div class="rows" id="vr"></div><div class="cta"><a class="btn w" id="vmap" href="#" target="_blank" rel="noopener">Get directions</a><a class="btn o" id="vwa" href="#">WhatsApp us</a></div></div></section>
<footer><div class="wrap"><div class="mark d" id="mark"></div><small id="fs"></small></div></footer>
<div class="bar"><a class="btn call" id="bcall" href="#">Call</a><a class="btn wa" id="bwa" href="#">WhatsApp us</a></div>
<script>
(function(){
var q=new URLSearchParams(location.search),b=(q.get("b")||"").replace(/[^a-z0-9.\-]/gi,""),$=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null){e.textContent=x;e.dir="auto"}return e}
document.getElementById("dx").onclick=function(){$("demo").hidden=true};
if(!b){document.body.textContent="This demo opens from a business card on the list.";return}
fetch("b/"+b+"/data.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
 var name=(q.get("n")||d.name||b).slice(0,70),ph=(q.get("p")||d.phone||"").replace(/[^\d+]/g,""),base="b/"+b+"/";
 var wa=function(t){var n=ph.replace("+","");return "https://wa.me/"+(/^9715/.test(n)?n:"")+"?text="+encodeURIComponent(t)};
 var hi="Hi "+name+", I found you on your website.";
 document.title=name; $("dn").textContent=name;
 if(d.brand){document.documentElement.style.setProperty("--ac",d.brand);document.documentElement.style.setProperty("--on",d.on||"#fff")}
 var lg=$("logo"); if(d.logo){var i=el("img");i.src=base+"logo.png";i.alt=name;lg.appendChild(i);if(d.logo_dark)lg.classList.add("dark")}else lg.appendChild(el("span",null,name));
 (d.nav||[]).slice(0,4).forEach(function(n){var a=el("a",null,n[0]);a.href=n[1];$("nav").appendChild(a)});
 $("eb").textContent=d.eyebrow; $("h1").textContent=d.headline; $("lede").textContent=d.lede||"";
 var lw=Math.max.apply(null,d.headline.split(/\s+/).map(function(w){return w.length}));if(d.headline.length>44||lw>10)$("h1").style.fontSize=lw>13?"clamp(24px,6vw,56px)":"clamp(30px,7.4vw,68px)";
 document.querySelectorAll("h1,#lede,#eb").forEach(function(x){x.dir="auto"});
 var hero=$("top"); if(d.hero){var bg=el("img","bg");bg.src=base+d.hero;bg.alt="";hero.insertBefore(bg,hero.firstChild)}else hero.classList.add("flat");
 ["hwa","cwa","qwa","vwa","bwa","abwa"].forEach(function(k){$(k).href=wa(hi)});
 var tel=ph?"tel:"+ph:"#"; $("qcall").href=tel; $("bcall").href=tel; $("qcalls").textContent=ph||"";
 var lat=q.get("lat")||d.lat,lon=q.get("lon")||d.lon,map=lat?"https://www.google.com/maps/search/?api=1&query="+lat+","+lon:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name+" Dubai");
 $("qmap").href=map; $("vmap").href=map;
 if(d.items&&d.items.length>=3){$("items").hidden=false;$("ih").textContent=d.items_title;$("c2").textContent=d.items_cta;$("c2").href="#items";$("iall").href=wa(hi+" Can you send me the full list?");
  d.items.forEach(function(it){var c=el("article","card rv"),p=el("div","ph"),im=el("img");im.src=base+it.img;im.alt=it.title;im.loading="lazy";p.appendChild(im);c.appendChild(p);
   var t=el("div","tx");t.appendChild(el("h3",null,it.title));if(it.sub)t.appendChild(el("div","sub",it.sub));var r=el("div","row");r.appendChild(el("div","price",it.price||""));var a=el("a","ask","Ask on WhatsApp");a.href=wa(hi+" Is this still available: "+it.title+(it.price?" ("+it.price+")":"")+"?");r.appendChild(a);t.appendChild(r);c.appendChild(t);$("grid").appendChild(c)})}
 else{$("c2").textContent="See what we do";$("c2").href="#svc"}
 if(d.services&&d.services.length>=3){$("svc").hidden=false;d.services.forEach(function(s){var a=el("a","rv");a.href=wa(hi+" I'd like a quote for: "+s);a.appendChild(el("span",null,s));a.appendChild(el("span",null,"→"));$("svcl").appendChild(a)})}
 else if(!(d.items&&d.items.length>=3)){$("c2").hidden=true}
 if(d.gallery&&d.gallery.length>=2){$("gal").hidden=false;$("gh").textContent=d.gallery_title;d.gallery.forEach(function(g){var im=el("img");im.src=base+g;im.alt="";im.loading="lazy";$("rail").appendChild(im)})}
 if(d.about&&d.about.length){$("about").hidden=false;d.about.forEach(function(p){$("ab").appendChild(el("p",null,p))});if(d.about_img){$("abimg").src=base+d.about_img;$("abimg").hidden=false}}
 if(!d.about_img||!(d.about&&d.about.length))$("abimg").remove();
 var vr=$("vr"); if(ph){var a=el("a",null,ph);a.href=tel;vr.appendChild(a)} if(d.mail){var m=el("a",null,d.mail);m.href="mailto:"+d.mail;vr.appendChild(m)} vr.appendChild(el("div",null,d.area||"Dubai, UAE"));
 $("mark").textContent=name; $("fs").textContent="© "+name+". Demo built by Terraflow from the photos and text on "+b+". Nothing here is published.";
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{rootMargin:"0px 0px -8% 0px"});
 document.querySelectorAll(".rv").forEach(function(x){io.observe(x)});
}).catch(function(){document.body.textContent="This demo isn't ready yet."});
})();
</script></body></html>

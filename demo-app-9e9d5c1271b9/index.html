<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>App demo</title>
<style>
:root{--acc:#334155;--acc-soft:rgba(51,65,85,.1);--ink:#101114;--mut:#6B7280;--line:#E7E8EC;--bg:#F4F5F7;--card:#fff;--ok:#15803D;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0E0F12;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input{font:inherit;color:inherit}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:44px;box-shadow:0 0 0 10px #1B1D22,0 0 0 12px #2C2F36,0 30px 80px rgba(0,0,0,.6)}}
.strip{flex:0 0 auto;height:44px;background:#101114;color:#fff;display:flex;align-items:center;justify-content:space-between;padding-left:16px;font-size:12px;letter-spacing:.01em}
.strip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.strip button{width:44px;height:44px;display:grid;place-items:center;color:#fff;opacity:.7;font-size:18px}
.view{position:relative;flex:1;min-height:0;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 18px 28px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s ease,transform .18s ease;-webkit-overflow-scrolling:touch}
.scr.on{opacity:1;transform:none;pointer-events:auto}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#9AA0AA;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--acc)}

.splash{position:absolute;inset:0;z-index:30;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;transition:opacity .35s ease}
.splash.off{opacity:0;pointer-events:none}
.icon{width:104px;height:104px;border-radius:26px;background:#fff;color:var(--acc);display:grid;place-items:center;font-size:40px;font-weight:800;letter-spacing:-.03em;box-shadow:0 14px 34px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.splash h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.splash p{margin:0;font-size:13px;opacity:.8}

.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.hello small{display:block;color:var(--mut);font-size:13px}
.hello h2{margin:2px 0 0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:700;overflow-wrap:anywhere}
.pill{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,17,20,.05)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.appt.has{background:var(--acc);color:#fff}
.appt.has .lbl{color:rgba(255,255,255,.75)}
.appt h3{margin:6px 0 2px;font-size:20px;letter-spacing:-.01em;line-height:1.2}
.appt p{margin:0;font-size:14px;color:var(--mut)}
.appt.has p{color:rgba(255,255,255,.85)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;text-align:center;padding:0 16px;margin-top:14px;transition:opacity .15s}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.onacc{background:#fff;color:var(--acc)}
.btn.dark{background:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{background:var(--card);border-radius:16px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(16,17,20,.05)}
.quick svg{width:24px;height:24px;color:var(--acc)}
.banner{display:block;width:100%;background:var(--acc-soft);border-radius:18px;padding:16px;min-height:44px}
.banner b{display:block;font-size:17px;margin-top:4px;letter-spacing:-.01em}
.banner span.go{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--acc)}
.banner{margin-bottom:12px}
.poprow{display:flex;width:100%;min-height:56px;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.poprow:first-child{border-top:0}
.poprow b{display:block;font-size:15px;font-weight:600}
.poprow small{color:var(--mut);font-size:13px}
.poprow .go{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--acc);background:var(--acc-soft);padding:8px 14px;border-radius:999px}
.note{font-size:12px;color:var(--mut);margin:10px 2px 0}

.stephead{display:flex;align-items:center;gap:8px;margin:-6px 0 6px -10px}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--ink)}
.back svg{width:22px;height:22px}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.dots i.d{background:var(--acc)}
.step{display:none}
.step.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.step h2,.h{margin:4px 0 4px;font-size:24px;letter-spacing:-.02em;line-height:1.15;font-weight:700}
.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,17,20,.05)}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.opt .pr{flex:0 0 auto;font-weight:700;font-size:14px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--acc);background:#fff}
.opt[aria-pressed="true"] .pr{color:var(--acc)}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;min-height:64px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);font-weight:600;border:2px solid transparent}
.day b{font-size:19px;color:var(--ink)}
.day[aria-pressed="true"]{background:var(--acc);color:rgba(255,255,255,.85)}
.day[aria-pressed="true"] b{color:#fff}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{min-height:48px;border-radius:12px;background:var(--card);text-align:center;font-weight:600;font-size:15px;border:2px solid transparent;font-variant-numeric:tabular-nums}
.time[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.time[disabled]{opacity:.4;text-decoration:line-through;cursor:default}
.field{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin-top:4px}
.field:focus{outline:2px solid var(--acc);outline-offset:1px}
.rows{margin:0}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0;padding-top:2px}
.row span{color:var(--mut);flex:0 0 auto}
.row b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.done{text-align:center;padding-top:10px}
.tick{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:8px auto 14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.tick svg{width:38px;height:38px}
.done .card{text-align:left;margin-top:18px}

.offer{position:relative;overflow:hidden}
.offer .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);padding:4px 8px;border-radius:999px}
.offer h3{margin:10px 0 2px;font-size:19px;letter-spacing:-.01em}
.offer p{margin:0;color:var(--mut);font-size:14px}
.offer .btn{min-height:46px;font-size:15px}
.push{position:absolute;left:10px;right:10px;top:10px;z-index:20;background:rgba(250,250,252,.97);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 34px rgba(0,0,0,.28);transform:translateY(-170%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1.1),visibility 0s .4s;width:auto;min-height:64px}
.push.on{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
.push .pi{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.push .pt{min-width:0;flex:1}
.push .ph{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.push .ph b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.push .ph span{color:var(--mut);flex:0 0 auto}
.push p{margin:1px 0 0;font-size:14px;line-height:1.3}

.loy{background:var(--acc);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:12px}
.loy .lbl{color:rgba(255,255,255,.75)}
.loy h3{margin:4px 0 16px;font-size:22px;letter-spacing:-.02em;overflow-wrap:anywhere}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;color:transparent;transition:background .2s,transform .2s}
.stamp svg{width:46%;height:46%}
.stamp.f{background:#fff;border-style:solid;border-color:#fff;color:var(--acc)}
.stamp.new{transform:scale(1.12)}
.loy p{margin:16px 0 0;font-size:15px}
.pts{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pts b{font-size:26px;letter-spacing:-.02em}
.meter{height:8px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;width:68%;background:var(--acc);border-radius:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(16,17,20,.05)}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut);line-height:1.25;display:block}
.bk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}
.bk .tm{flex:0 0 58px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bk .wh{min-width:0;flex:1}
.bk .wh b{display:block;font-size:15px;overflow-wrap:anywhere}
.bk .wh small{color:var(--mut);font-size:13px}
.bk .nw{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ok);padding:4px 8px;border-radius:999px}
.toast{position:absolute;left:50%;bottom:86px;z-index:25;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="strip" id="strip"><span id="stripText"></span><button id="stripX" aria-label="Hide demo strip">&times;</button></div>
  <div class="view">
    <section class="scr" data-scr="home" id="scr-home"></section>
    <section class="scr" data-scr="book" id="scr-book"></section>
    <section class="scr" data-scr="offers" id="scr-offers"></section>
    <section class="scr" data-scr="card" id="scr-card"></section>
    <section class="scr" data-scr="owner" id="scr-owner"></section>
    <button class="push" id="push" aria-live="polite"><span class="pi" id="pushIcon"></span><span class="pt"><span class="ph"><b id="pushName"></b><span>now</span></span><p id="pushText"></p></span></button>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="App sections">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Book</button>
    <button data-tab="offers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Offers</button>
    <button data-tab="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>Card</button>
  </nav>
  <div class="splash" id="splash"><div class="icon" id="splashIcon"></div><h1 id="splashName"></h1><p>Sample app</p></div>
</div>
<script>
(function(){

 shop:{acc:"#047857",sample:"Corner Home Store",noun:"request",label:"Request",confirm:"Send request",doneTitle:"Request sent",
  steps:[L("What do you need?","Sample options.",[["Ask for a quote","We reply the same day","Free"],["Reserve an item","Hold it for pick-up",""],["Book a store visit","Someone will be ready for you","Free"]]),

  offers:[["Today only","15% off everything in store","Show this offer at the till before 8pm."],["Members","AED 25 off after 8 visits","Stamps add up each time you buy."],["New stock","Fresh arrivals this week","App customers hear first."]],
  push:"15% off in store today until 8pm. Show the app at the till.",reward:"AED 25 off"},
 trade:{acc:"#334155",sample:"Skyline Technical Services",noun:"visit",label:"Job",confirm:"Send request",doneTitle:"Request sent",

};
var P=new URLSearchParams(location.search),key=(P.get("t")||"").toLowerCase();

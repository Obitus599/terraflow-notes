<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraflow Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700&display=swap">
<style>
  :root { --onyx:#0A0A0A; --n900:#171717; --n600:#525252; --n500:#737373; --n300:#D4D4D4; --moon:#FAFAFA; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px;
    background: var(--onyx); color: var(--moon);
    font-family: Switzer, "Helvetica Neue", Arial, sans-serif;
    font-weight: 400; font-size: 17px; line-height: 1.6; letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 46ch; }
  .mark {
    display: inline-block; font-weight: 600; font-size: 13px; letter-spacing: .24em;
    text-decoration: none; color: var(--moon); margin-bottom: 34px;
  }
  .mark .studio { color: var(--n500); }
  p { margin: 0 0 14px; color: var(--n300); }
  p.quiet { color: var(--n600); font-size: 15px; }
  a.link { color: var(--moon); text-decoration: none; border-bottom: 1px solid var(--n600); }
  a.link:hover { border-bottom-color: var(--moon); }
</style>
</head>
<body>
  <div class="box">
    <a class="mark" href="https://terraflow.studio">TERRAFLOW<span class="studio">.STUDIO</span></a>
    <p>Nothing lives at this address on its own. If somebody sent you a link to a page of notes, use that link.</p>
    <p class="quiet">Otherwise we are at <a class="link" href="https://terraflow.studio">terraflow.studio</a>, or say hello at <a class="link" href="mailto:hello@terraflow.studio">hello@terraflow.studio</a>.</p>
  </div>
</body>
</html>
